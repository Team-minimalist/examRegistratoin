<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - Examination Portal</title>
    <link rel="stylesheet" href="/css/Styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        .admin-badge {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: inline-block;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="admin-badge">OFFICIAL USE ONLY</span>
            <h2>Administrator Portal</h2>
            <p>Sign in to manage examinations and student records</p>
        </div>

        <div id="admin-login-alert" class="alert" style="display: none;"></div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="adminUsername">Username or Official Email <span>*</span></label>
                <input type="text" id="adminUsername" placeholder="admin@examportal.gov.in" required autofocus>
            </div>

            <div class="form-group">
                <label for="adminPassword">Password <span>*</span></label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>

            <button type="submit" id="admin-login-btn" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.75rem;">
                Administrator Sign In
            </button>
        </form>

        <div class="auth-footer" style="margin-top: 1.5rem;">
            New Examination Official? <a href="/admin-registration.html">Register with Invitation Code</a>
            <div style="margin-top: 0.75rem;">
                <a href="/login.html" style="color: var(--primary); font-size: 0.85rem;">&larr; Switch to Student Login</a>
            </div>
            <div style="margin-top: 0.5rem;">
                <a href="/" style="color: var(--gray); font-size: 0.8rem;">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('admin-login-alert');
            const submitBtn = document.getElementById('admin-login-btn');
            alertBox.style.display = 'none';

            const usernameOrEmail = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!usernameOrEmail || !password) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Please provide both username/email and password.';
                alertBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const response = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameOrEmail, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Authenticated successfully! Redirecting to Administrator Dashboard...';
                    alertBox.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard.html';
                    }, 800);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.message || 'Invalid administrator credentials.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Connection error. Please try again later.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Administrator Sign In';
            }
        });
    </script>
</body>
</html>
