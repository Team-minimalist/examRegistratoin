<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exam Registration System</title>
    <link rel="stylesheet" href="/css/Styles.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-badge"><img src="/images/logo-white.png" alt="Exam Registration" class="brand-icon"></div>
            <h2>Welcome Back</h2>
            <p>Log in to your examination portal</p>
        </div>

        <div id="alert-message" class="alert" style="display: none;"></div>

        <!-- Local Login Form -->
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username or Email <span>*</span></label>
                <input type="text" id="username" name="username" placeholder="Enter username or email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">Log In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Google OAuth2 Login -->
        <a href="/oauth2/authorization/google" class="btn-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </a>

        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Create Student Account</a>
            <div style="margin-top: 0.75rem;">
                <a href="/" style="color: var(--gray); font-size: 0.8rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
