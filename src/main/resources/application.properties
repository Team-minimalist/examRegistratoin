spring.application.name=exam-registration

# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/exam-registration

# Google OAuth2 Client Configuration
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET environment variables in production/testing
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Springdoc OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
