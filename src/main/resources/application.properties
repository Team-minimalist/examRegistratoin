spring.application.name=exam-registration

# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/exam-registration

# Admin bootstrap and invitation code
app.admin.invitation-code=${ADMIN_INVITATION_CODE:ADMIN-SECRET-2026}
app.admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@examportal.gov.in}
app.admin.initial.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.admin.initial.name=${INITIAL_ADMIN_NAME:System Administrator}
app.admin.initial.username=${INITIAL_ADMIN_USERNAME:admin}

# Google OAuth2 Client Configuration
# Explicit URIs prevent blocking OIDC network discovery on startup in offline/firewalled environments
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Springdoc OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
